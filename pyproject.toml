[tool.poetry]
name = "marketpilot"
version = "0.1.0"
description = ""
authors = ["Elham Nikbakht Bidgoli <nikbakht.enb4@gmail.com>"]
readme = "README.md"
packages = [
    { include = "adapters" },
    { include = "schemas" },
    { include = "data_farm" },
    { include = "stages" },
]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.3.3"
numpy = "^2.3.4"
pyyaml = "^6.0.3"
requests = "^2.32.5"
aiohttp = "^3.13.2"
loguru = "^0.7.3"

[tool.poetry.group.dev.dependencies]
# Add your development dependencies here
pytest = "^8.4.2"
black = "^25.9.0"
flake8 = "^7.3.0"
pre-commit = "^4.3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"