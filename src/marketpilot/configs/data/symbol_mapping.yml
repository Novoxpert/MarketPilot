# --------------------------------------
# Mapping Rules
# --------------------------------------
mapping_rules:
  exact_match_priority: true
  case_sensitive: false
  fallback_strategy: "lowercase"

  extract_base_from_exchange_format: true

  strip_pairs:
    - "USDT"
    - "USD"
    - "USDC"
    - "BUSD"
    - "EUR"

  exchange_prefixes:
    - "BINANCE:"
    - "NASDAQ:"
    - "NYSE:"
    - "IG:"
    - "OANDA:"
    - "COINBASE:"
    - "KRAKEN:"

  symbol_suffixes:
    - ".P"
    - ".F"
    - "-USD"
    - "-USDT"
