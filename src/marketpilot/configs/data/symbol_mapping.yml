# Symbol Mapping Configuration
# Maps trading symbols to asset slugs for news API

# Cryptocurrency Mappings
cryptocurrencies:
  BTC:
    slug: "bitcoin"
    aliases:
      - "BTCUSDT"
      - "BTCUSD"
      - "BINANCE:BTCUSDT.P"
      - "BTC-USD"
      - "XBTUSD"

  ETH:
    slug: "ethereum"
    aliases:
      - "ETHUSDT"
      - "ETHUSD"
      - "BINANCE:ETHUSDT.P"
      - "ETH-USD"

  USDT:
    slug: "tether"
    aliases:
      - "USDTUSD"
      - "USDT-USD"

  USDC:
    slug: "usd-coin"
    aliases:
      - "USDCUSD"
      - "USDC-USD"

  BNB:
    slug: "binance-coin"
    aliases:
      - "BNBUSDT"
      - "BNBUSD"
      - "BNB-USD"

  XRP:
    slug: "ripple"
    aliases:
      - "XRPUSDT"
      - "XRPUSD"
      - "XRP-USD"

  ADA:
    slug: "cardano"
    aliases:
      - "ADAUSDT"
      - "ADAUSD"
      - "ADA-USD"

  SOL:
    slug: "solana"
    aliases:
      - "SOLUSDT"
      - "SOLUSD"
      - "SOL-USD"

  DOGE:
    slug: "dogecoin"
    aliases:
      - "DOGEUSDT"
      - "DOGEUSD"
      - "DOGE-USD"

  DOT:
    slug: "polkadot"
    aliases:
      - "DOTUSDT"
      - "DOTUSD"
      - "DOT-USD"

# Stock Mappings
stocks:
  AAPL:
    slug: "apple"
    name: "Apple Inc."
    aliases:
      - "NASDAQ:AAPL"

  TSLA:
    slug: "tesla"
    name: "Tesla Inc."
    aliases:
      - "NASDAQ:TSLA"

  NVDA:
    slug: "nvidia"
    name: "NVIDIA Corporation"
    aliases:
      - "NASDAQ:NVDA"

  GOOGL:
    slug: "google"
    name: "Alphabet Inc."
    aliases:
      - "NASDAQ:GOOGL"
      - "GOOG"
      - "NASDAQ:GOOG"

  MSFT:
    slug: "microsoft"
    name: "Microsoft Corporation"
    aliases:
      - "NASDAQ:MSFT"

  AMZN:
    slug: "amazon"
    name: "Amazon.com Inc."
    aliases:
      - "NASDAQ:AMZN"

  META:
    slug: "meta"
    name: "Meta Platforms Inc."
    aliases:
      - "NASDAQ:META"
      - "FB"
      - "NASDAQ:FB"

  NFLX:
    slug: "netflix"
    name: "Netflix Inc."
    aliases:
      - "NASDAQ:NFLX"

# Mapping Rules
mapping_rules:
  # Try exact match first
  exact_match_priority: true

  # Case sensitivity
  case_sensitive: false

  # Fallback strategy when no mapping found
  fallback_strategy: "lowercase"  # Options: lowercase, error, original

  # Extract base symbol from exchange:pair.type format
  extract_base_from_exchange_format: true

  # Common cryptocurrency pairs to strip
  strip_pairs:
    - "USDT"
    - "USD"
    - "USDC"
    - "BUSD"
    - "EUR"

  # Exchange prefixes to remove
  exchange_prefixes:
    - "BINANCE:"
    - "NASDAQ:"
    - "NYSE:"
    - "COINBASE:"
    - "KRAKEN:"

  # Symbol suffixes to remove
  symbol_suffixes:
    - ".P"  # Perpetual
    - ".F"  # Futures
    - "-USD"
    - "-USDT"
