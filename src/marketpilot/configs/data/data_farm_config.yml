# Data Farm Configuration
logging:
  level: INFO

output:
  base_dir: data_farm_exports  # Dynamic from config
  formats: ["parquet"]          # Can be ["parquet", "json"]
  compression: snappy           # snappy, gzip, etc.

# Target symbols
target_symbols:
  - "BINANCE:BTCUSDT.P"
  - "BINANCE:ETHUSDT.P"

adapters:
  # Price Data Adapter
  - id: price_internal_001       # Used in data_collection
    type: price
    vendor: internal_price_api          # Used in data_collection
    cadence: 1min
    schema_type: price
    # start: optional datetime     # Can be provided dynamically at runtime
    # end: optional datetime       # Can be provided dynamically at runtime

  # News Data Adapter (commented out for now)
  - id: "news_internal_001"
    type: "news"
    vendor: "internal_news_api"
    cadence: "5min"
    schema_type: "news"
    limit: 100

  # Fundamental Data Adapter (commented out for now)
  - id: fundamental_fmp_001
    type: fundamental
    vendor: fmp
    cadence: daily
    schema_type: fundamental

# Quality Assurance Configuration
quality:
  quality_threshold: 0.95        # Used in QA stage
  validation_rules:
    price:
      - no_nan_values
      - volume_consistency
    news:
      - no_duplicates
      - content_quality
      - symbol_mapping
    fundamental:
      - no_nan_values
      - metric_consistency
