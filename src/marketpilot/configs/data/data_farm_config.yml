# Data Farm Configuration
logging:
  level: INFO

output:
  base_dir: data  # Dynamic from config
  formats: ["parquet"]          # Can be ["parquet", "json"]
  compression: snappy           # snappy, gzip, etc.

# Target symbols
target_symbols:
  - "BINANCE:BTCUSDT.P"
  - "BINANCE:ETHUSDT.P"

adapters:
  # Price Data Adapter
  # - id: price_internal_001       # Used in data_collection
  #   type: price
  #   vendor: internal_price_api   # Used in data_collection
  #   cadence: 1min
  #   schema_type: price
    # start: optional datetime     # Can be provided dynamically at runtime
    # end: optional datetime       # Can be provided dynamically at runtime

  # News Data Adapter
  - id: "news_internal_001"
    type: "news"
    vendor: "internal_news_api"
    cadence: "5min"
    schema_type: "news"
    limit: 100
    
    # Pagination config (NEW)
    enable_pagination: true           # فعال/غیرفعال کردن pagination
    max_pages: 10                     # حداکثر تعداد صفحات (برای جلوگیری از infinite loop)
    max_total_records: 1000           # حداکثر تعداد کل رکوردها
    page_delay: 0.5                   # تاخیر بین صفحات (ثانیه) - برای rate limiting
    
    # Retry config
    max_retries: 3
    retry_delay: 2.0
    backoff_factor: 2.0
    timeout: 30


  # Fundamental Data Adapter (commented out - no real API yet)
  # - id: fundamental_fmp_001
  #   type: fundamental
  #   vendor: fmp
  #   cadence: daily
  #   schema_type: fundamental

# Quality Assurance Configuration
quality:
  quality_threshold: 0.80        # Slightly lower for testing with real data
  validation_rules:
    price:
      - no_nan_values
      - volume_consistency
    news:
      - content_quality          # Checks for title/subtitle/content
      # - no_duplicates          # Can be enabled later
      # - symbol_mapping         # Automatically handled by adapter
    fundamental:
      - no_nan_values
      - metric_consistency
