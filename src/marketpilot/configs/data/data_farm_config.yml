# Data Farm Configuration
logging:
  level: INFO

output:
  base_dir: data
  formats: ["parquet"]
  compression: snappy

# Target symbols
target_symbols:
  - "BINANCE:BTCUSDT.P"
  - "BINANCE:ETHUSDT.P"

adapters:
  # Price Data Adapter
  - id: price_internal_001
    type: price
    vendor: internal_price_api
    cadence: 1min
    schema_type: price
    
    # Pagination config for Price
    limit: 1000                     
    enable_pagination: true         
    max_pages: 500                  
    max_total_records: 500000       
    page_delay: 0.3                 
    
    # Retry config
    max_retries: 3
    retry_delay: 2.0
    backoff_factor: 2.0
    timeout: 30

  # News Data Adapter
  - id: "news_internal_001"
    type: "news"
    vendor: "internal_news_api"
    cadence: "5min"
    schema_type: "news"
    
    # Pagination config for News
    limit: 100                       
    enable_pagination: true           
    max_pages: 200                    
    max_total_records: 20000           
    page_delay: 0.5                  
    
    # Retry config
    max_retries: 3
    retry_delay: 2.0
    backoff_factor: 2.0
    timeout: 30

# Quality Assurance Configuration
quality:
  quality_threshold: 0.80
