# Price Data Schema
type: price
required_columns:
  - symbol
  - candle_time
  - open
  - high
  - low
  - close
  - volume

optional_columns:
  - adjusted_close
  - split_coefficient
  - dividend_amount

data_types:
  symbol: string
  candle_time: datetime
  open: float
  high: float
  low: float
  close: float
  volume: float
  adjusted_close: float
  split_coefficient: float
  dividend_amount: float
